  # (rather than an invented "typical spacing" figure with no citation)
  # to signal "point, no areal footprint," and rely on
  # native_spatial_resolution_descriptor to carry the real semantics.
  # This is a judgment call, not a resolved schema fit -- flagged.
  native_spatial_resolution_m: 0
  native_spatial_resolution_descriptor: point station network (EPA AQS monitor)
  crs: EPSG:4269
  spatial_extent_descriptor: United States (state/local/tribal monitoring agencies)
