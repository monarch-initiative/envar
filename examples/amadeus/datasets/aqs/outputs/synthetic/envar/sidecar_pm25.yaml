uncertainty: {}
exposure_model:
  exposure_model_type: direct_measurement
  exposure_model_inputs:
  - FRM (Federal Reference Method, manual gravimetric) or FEM (Federal Equivalent Method, automated) PM2.5
    monitors; daily summary is the mean of sub-daily samples at the reporting monitor (or the single 24-hour
    sample where the monitor reports one)
  exposure_model_known_biases:
  - Regulatory monitor placement is not spatially uniform (documented equity/coverage gaps in rural and
    some lower-income urban areas), so nearest-monitor distance varies widely and can be large in monitor-sparse
    regions -- this is exactly why linkage_max_distance_to_station_m is recorded, not left implicit.
linkage_method:
