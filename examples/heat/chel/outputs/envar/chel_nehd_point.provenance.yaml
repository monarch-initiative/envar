provenance_id: C4C4M5WG6YW8Z61CZ2X2CRE2NE-chel-point
variable:
  name: E_NEHD
  label: Annual mean number of extreme heat days, 2018-2022 (EJI 2024 via CHEL)
  units_ucum: d
  value_data_type: continuous_numeric
  concept_status: gap
  definition_source: https://atsdr.cdc.gov/place-health/php/eji/eji-indicators-climate-burden-module.html
  companion_percentile_variable: EPL_NEHD
spatial:
  crs: EPSG:4326
  native_spatial_resolution_descriptor: H3 resolution 3, about 12,000 km2 per cell
    (CHEL Documentation.md §1.3)
  extraction_method: area_weighted_polygon_mean
  _extraction_method_note: 'CHEL''s tract-to-hexagon operator, inferred: Documentation.md
    §2.6 says climate inputs use area-weighted or intersection-based aggregation depending
    on source format, and does not say which applies to extreme heat days. The person-level
    step is a lookup of the hexagon''s value; see linkage.'
  target_geography_type: h3_hex
  spatial_extent_descriptor: United States incl. Alaska, Hawaii, Puerto Rico and island
    territories; 929 H3 res-3 cells
exposure_model:
  inputs:
  - CDC National Environmental Public Health Tracking Network extreme heat days (via
    EJI 2024)
temporal:
  temporal_resolution: annual
  temporal_aggregation_method: mean
  temporal_coverage_start: '2018-01-01'
  temporal_coverage_end: '2022-12-31'
  calendar: gregorian
source_dataset:
  name: CLAD Hex Environmental Linkage (CHEL) 2024, from CDC/ATSDR Environmental Justice
    Index 2024
  short_code: chel_2024
  version: 2024 (cladteam/CHEL@4dd219e)
  producer_institution: Center for Linkage and Acquisition of Data (CLAD)
  license_spdx: NOASSERTION
  access_url: https://raw.githubusercontent.com/cladteam/CHEL/4dd219e256ba664a9151d4d8d7aefac65ef2ce28/data/CHEL_hex3_2024.csv
  native_format: CSV
linkage:
  strategy: area_membership_residence_in_polygon
  geocoding_precision_propagated: range
  geocoding_score_propagated: 0.92
  address_period_alignment: single_static_address
  path: residence point -> containing H3 res-3 cell (h3.latlng_to_cell) -> CHEL h3_id
  effective_spatial_resolution: h3_res3_cell
  join_key: h3_id
  match:
    persons: 3
    persons_with_hexagon: 3
    persons_with_value: 3
null_semantics:
  '-999': no data for this hexagon; mapped to NULL. CHEL Documentation.md §4.3.3 distinguishes
    structural nulls, derived nulls and true zeros but does not say which one -999
    encodes
temporal_alignment:
  exposure_window: 2018-01-01..2022-12-31
  observation_windows:
  - 2018-05-01..2022-09-30
  - 2020-01-15..2022-09-30
  release_selection: 'CHEL 2024 chosen per variable: E_NEHD exists only in the 2024
    release. The CHEL README''s enrollment-year rule would route persons enrolled
    2015-2018 to CHEL 2022, which has no extreme heat days'
  persons_without_value_under_readme_rule:
  - '91204'
  - '91205'
