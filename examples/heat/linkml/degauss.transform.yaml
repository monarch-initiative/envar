id: envar-degauss-transform
title: EnVar patients → DeGAUSS geocoder input table
source_schema:
  name: envar_heat_patients
target_schema:
  name: envar_heat_degauss_input

class_derivations:
  DegaussCohortTable:
    populated_from: PatientCohort
    slot_derivations:
      rows:
        populated_from: patients

  DegaussRow:
    populated_from: Patient
    slot_derivations:
      person_id:
        populated_from: person_id
      # build_address: prefer explicit geocoder_input, else "{street} {zip}".
      address:
        expr: >-
          address.geocoder_input if address.geocoder_input
          else str(address.street) + " " + str(address.zip)
      start_date:
        populated_from: window_start
      end_date:
        populated_from: window_end
